
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Management System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eef2ff, #dbeafe);
            min-height: 100vh;
        }

        .navbar {
            background: #312e81;
        }

        .hero {
            min-height: 75vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
        }

        .hero-card {
            background: white;
            padding: 50px 35px;
            max-width: 750px;
            width: 100%;
            border-radius: 22px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.10);
        }

        .book-icon {
            font-size: 65px;
        }

        .hero h1 {
            color: #312e81;
            font-weight: bold;
            margin: 20px 0;
        }

        .hero p {
            color: #64748b;
            font-size: 18px;
            line-height: 1.7;
        }

        .btn-custom {
            padding: 12px 24px;
            border-radius: 9px;
            font-weight: 600;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #64748b;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-dark px-4 py-3">
    <a class="navbar-brand fw-bold" href="/">📚 My Library</a>

    <div class="d-flex gap-2">
        <a href="{% url 'user_login' %}" class="btn btn-outline-light">
            User Login
        </a>

        <a href="{% url 'admin_login' %}" class="btn btn-light">
            Admin Login
        </a>
    </div>
</nav>

<section class="hero">
    <div class="hero-card">

        <div class="book-icon">📚</div>

        <h1>Welcome to Our Library</h1>

        <p>
            Discover your next favourite book. 
        </p>

        <div class="d-flex justify-content-center gap-3 flex-wrap mt-4">

            <a href="{% url 'user_login' %}"
               class="btn btn-primary btn-custom">
                User Login
            </a>

            <a href="{% url 'register' %}"
               class="btn btn-success btn-custom">
                Create Account
            </a>

        </div>

        <p class="mt-4 mb-0 small">
            Admin? <a href="{% url 'admin_login' %}">Login here</a>
        </p>

    </div>
</section>

<footer>
    Library Management System · Read More, Learn More
</footer>

</body>
</html>
